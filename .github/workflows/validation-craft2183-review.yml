name: Validate exact feed review fixes
on:
  push:
    branches: [validation/20261127-craft2183-review]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_NET_RETRY: '10'
      RUST_BACKTRACE: '1'
      RUSTUP_TOOLCHAIN: '1.100.0'
      CANDIDATE_TREE: '5a43525f217b8cb56899f370e5b69f2438179ba4'
      CANDIDATE_SHA: '030917d59637a7a6225971cf0268e5964652cf49'
    steps:
      - name: Check out immutable source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '030917d59637a7a6225971cf0268e5964652cf49'
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
      - name: Repository CI build environment
        uses: storytold/craft-common-actions/actions/gate-setup@315eb1972c857c839c3abb3d9288bfd40d21b7da
        with:
          craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          require-craft-fonts: 'true'
          packages: >-
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
          toolchain: '1.100.0'
          cache-job: build
          cache-save: 'false'
          writes: 'false'
      - name: Report compiler version
        run: rustc --version --verbose
      - name: Required policy and formatting gates
        run: |
          set -euo pipefail
          cargo xtask fmt --check
          cargo xtask layers
          cargo xtask locks
          cargo xtask secrets
      - name: Build real CLI used by AI integration tests
        run: cargo build --locked -p craft-anything-cli
      - name: Complete Engine AI UI and Platform targets
        run: cargo test --no-fail-fast --locked -p craft-anything-engine -p craft-anything-ai -p craft-anything-ui-egui -p craft-anything-platform
      - name: Clippy all changed crates and tests
        run: cargo clippy --locked -p craft-anything-engine -p craft-anything-ai -p craft-anything-ui-egui -p craft-anything-platform --all-targets -- -D warnings
      - name: Check round regression rejects original per-event Worker
        run: |
          python - <<'PY'
          #!/usr/bin/env python3
          """Prove the check-round regression at the real Worker producer boundary."""
          from pathlib import Path
          import re
          import subprocess
          
          path = Path("crates/ai/src/rebuild/mod.rs")
          original = path.read_bytes()
          text = original.decode()
          start = text.index("    fn emit_checks(&self, checks: &[CheckResult]) {")
          end = text.index("    fn step(&self,", start)
          old_producer = """    fn emit_checks(&self, checks: &[CheckResult]) {
                  for check in checks {
                      self.emit(RunEvent::Checked(check.clone()));
                  }
              }
          
          """
          name = "rebuild::feed::tests::a_recovered_check_round_is_journaled_before_its_first_event_can_save"
          try:
              path.write_text(text[:start] + old_producer + text[end:])
              command = ["cargo", "test", "--locked", "-p", "craft-anything-ai", "--lib", name, "--", "--exact", "--nocapture"]
              result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout, end="", flush=True)
              assert result.returncode != 0, "the old per-event Worker producer unexpectedly passed"
              assert "running 1 test" in result.stdout, "the regression did not execute"
              assert re.search(r"test " + re.escape(name) + r" \.\.\. FAILED", result.stdout), "failure was not the intended test"
              assert "test result: FAILED. 0 passed; 1 failed; 0 ignored" in result.stdout
              assert "older, external and repeated checks survive" in result.stdout, "failure did not reach the check reconciliation assertion"
              print("NEGATIVE_CONTROL_CONFIRMED=worker_per_event_check_round", flush=True)
          finally:
              path.write_bytes(original)
              assert path.read_bytes() == original
          PY
      - name: Workspace allocation regression rejects cleanup after deletion
        run: |
          python - --case allocation <<'PY'
          #!/usr/bin/env python3
          """Run one exact workspace regression against a reverted mechanism, then restore bytes.
          
          This is validation-only scaffolding; it is not part of the PR source tree.
          The allocation function is the exact 67d91ffff5990687ca5a2419f43b8c87712b7920 implementation.
          """
          import argparse
          import hashlib
          import re
          import subprocess
          from pathlib import Path
          
          OLD_DELETE = '    fn delete_with_cleanup(\n        self,\n        after_discovery: impl FnOnce(&[PathBuf]),\n        mut gone: impl FnMut(&Path) -> Result<(), ToolError>,\n        after_claim: impl FnOnce(),\n        allocate: &dyn Fn(&Path) -> Result<PathBuf, ToolError>,\n    ) -> Result<(), ToolError> {\n        if !self.root.join(MANIFEST).is_file() {\n            return Err(ToolError::invalid(format!("{} isn\'t a project folder.", self.root.display())));\n        }\n        let feed = crate::feed::lock_project(&self.root)?;\n        // The caller may still hold a workspace loaded before this folder was reused.\n        // Acquiring the replacement project\'s lock must not authorize deleting its data.\n        feed.check_workspace(&self)?;\n        // A legacy project can have personal files at a name reserved by a later version.\n        // Read the receipts before removing the inbox, and never recursively remove backups.\n        let backups = crate::feed::owned_backups(&self.root)?;\n        after_discovery(&backups);\n        crate::feed::remove_owned_backups(&self.root, &backups)?;\n        if !self.manifest.app_in_root {\n            gone(&self.app_dir())?;\n        }\n        // Keep the coordination inode until craft.json is gone. Waiting writers then see\n        // an unavailable project before they can start another transaction.\n        for name in OWN_NAMES {\n            if *name == MANIFEST || *name == "inbox" || crate::feed::DAMAGED_BACKUP_NAMES.contains(name) {\n                continue;\n            }\n            gone(&self.root.join(name))?;\n        }\n        // Fallible payload cleanup keeps the project discoverable and its lock inode intact,\n        // so a person can repair access and retry. Only coordination cleanup follows deletion.\n        let inbox = self.inbox_dir();\n        let inbox_identity = FileHandle::from_path(&inbox).map_err(|error| ToolError::io(inbox.display(), error))?;\n        for entry in std::fs::read_dir(&inbox).map_err(|error| ToolError::io(inbox.display(), error))? {\n            let entry = entry.map_err(|error| ToolError::io(inbox.display(), error))?;\n            if !feed.is_lock_entry(&entry.path())? {\n                gone(&entry.path())?;\n            }\n        }\n        // Allocate while the manifest still permits a retry. Coordination cleanup must not\n        // discover only after deleting it that there is no space for the private claim.\n        let cleanup = CreationCleanup::reserve(&self.root, allocate).map_err(|error| {\n            let guidance = format!("The project manifest was kept. Inspect {} and restore cleanup access or space before retrying deletion.", inbox.display());\n            let guidance = match &error.remediation {\n                Some(previous) => format!("{previous} {guidance}"),\n                None => guidance,\n            };\n            error.with_remediation(guidance)\n        })?;\n        let removed = (|| {\n            feed.check_workspace(&self)?;\n            CreationReservation::check_directory(&inbox, &inbox_identity)?;\n            cleanup.empty_path(&self.root)?;\n            let lock = inbox.join(crate::feed::PROJECT_LOCK_FILE);\n            if !feed.is_lock_entry(&lock)? {\n                return Err(copy_changed(&lock));\n            }\n            gone(&self.root.join(MANIFEST))\n        })();\n        if let Err(error) = removed {\n            let released = feed.check_workspace(&self).and_then(|()| cleanup.remove_empty(&self.root));\n            let guidance = match released {\n                Ok(()) => format!("Inspect {} and {} before retrying deletion.", self.root.join(MANIFEST).display(), inbox.display()),\n                Err(cleanup_error) => format!(\n                    "Inspect {} and {}, together with the reserved cleanup folder at {}: {}",\n                    self.root.join(MANIFEST).display(),\n                    inbox.display(),\n                    self.root.join(&cleanup.name).display(),\n                    cleanup_error.for_people()\n                ),\n            };\n            let guidance = match &error.remediation {\n                Some(previous) => format!("{previous} {guidance}"),\n                None => guidance,\n            };\n            return Err(error.with_remediation(guidance));\n        }\n        feed.finish_deletion(&inbox_identity, &cleanup, after_claim)?;\n        if std::fs::read_dir(&self.root).is_ok_and(|mut d| d.next().is_none()) {\n            let _ = std::fs::remove_dir(&self.root);\n        }\n        Ok(())\n    }\n'
          BYTE_COPY = 'fn copy_new_windows_file(from: &Path, to: &Path, source: &std::fs::File, metadata: &std::fs::Metadata) -> Result<(), ToolError> {\n    use std::io::Seek as _;\n    let mut source = source.try_clone().map_err(|error| ToolError::io(from.display(), error))?;\n    source.rewind().map_err(|error| ToolError::io(from.display(), error))?;\n    let mut output = std::fs::OpenOptions::new().write(true).create_new(true).open(to).map_err(|error| ToolError::io(to.display(), error))?;\n    std::io::copy(&mut source, &mut output).map_err(|error| ToolError::io(from.display(), error))?;\n    output.set_permissions(metadata.permissions()).map_err(|error| ToolError::io(to.display(), error))\n}'
          TESTS = {
              "allocation": "workspace::tests::deletion_preclaim_failures_keep_the_manifest_and_inbox_retryable",
              "alias": "workspace::tests::duplication_classifies_case_renamed_backups_after_discovery",
              "streams": "workspace::tests::new_file_copies_preserve_ntfs_streams_and_refuse_occupied_destinations",
          }
          
          def mutate(source, case):
              if case == "allocation":
                  begin = source.index("    fn delete_with_cleanup(")
                  end = source.index("\n    /// Start a project", begin)
                  return source[:begin] + OLD_DELETE + source[end:]
              if case == "alias":
                  replaced, count = re.subn(r"None\s*=>\s*self\.owns_missing_alias\(path,\s*file,\s*stop\)\?,", "None => false,", source)
                  if count != 1:
                      raise AssertionError(f"expected one missing-alias dispatch, found {count}")
                  return replaced
              begin = source.index("fn copy_new_windows_file(")
              end = source.index("\n}", begin) + 2
              return source[:begin] + BYTE_COPY + source[end:]
          
          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--case", choices=TESTS, required=True)
              parser.add_argument("--repo", type=Path, default=Path.cwd())
              parser.add_argument("--package", default="craft-anything-engine")
              parser.add_argument("--timeout", type=int, default=900)
              args = parser.parse_args()
              repo = args.repo.resolve()
              path = repo / "crates/engine/src/workspace.rs"
              original = path.read_bytes()
              fingerprint = hashlib.sha256(original).hexdigest()
              test = TESTS[args.case]
              command = ["cargo", "test", "--locked", "-p", args.package, "--lib", test, "--", "--exact", "--nocapture"]
              try:
                  source = original.decode().replace("\r\n", "\n")
                  changed = mutate(source, args.case)
                  if changed == source:
                      raise AssertionError("counterfactual did not change production source")
                  path.write_text(changed, encoding="utf-8")
                  result = subprocess.run(command, cwd=repo, capture_output=True, text=True, timeout=args.timeout)
                  output = result.stdout + result.stderr
                  print(output, end="" if output.endswith("\n") else "\n", flush=True)
                  if result.returncode != 101:
                      raise AssertionError(f"expected cargo test failure 101 for {args.case}, got {result.returncode}")
                  if not re.search(r"running 1 test\b", output) or not re.search(r"test result: FAILED\. 0 passed; 1 failed;", output) or test not in output:
                      raise AssertionError("the exact regression did not execute and fail; a build or filter error is not a counterfactual")
                  print(f"COUNTERFACTUAL CONFIRMED: {args.case}: {test} ran and failed", flush=True)
              finally:
                  path.write_bytes(original)
                  if path.read_bytes() != original:
                      raise AssertionError("failed to restore the original source bytes")
                  print(f"RESTORED workspace.rs sha256={fingerprint}", flush=True)
          
          if __name__ == "__main__":
              main()
          PY
