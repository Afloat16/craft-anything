name: Validate queued request recovery
on:
  push:
    branches: [validation/20261127-craft2224-recovery]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_NET_RETRY: '10'
      RUST_BACKTRACE: '1'
      CANDIDATE_SHA: 'a414433c968a56d31705f89df9018813cf165700'
    steps:
      - name: Check out the immutable source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'a414433c968a56d31705f89df9018813cf165700'
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source identity
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Repository CI build environment
        uses: storytold/craft-common-actions/actions/gate-setup@315eb1972c857c839c3abb3d9288bfd40d21b7da
        with:
          craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          require-craft-fonts: 'true'
          packages: >-
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
          toolchain: stable
          cache-save: 'false'
          writes: 'false'
      - name: Format and record the exact tested source
        run: |
          rustfmt --edition 2024 crates/ai/src/rebuild/queued_request.rs crates/ai/src/rebuild/runs.rs crates/ui-egui/src/project.rs
          python3 - <<'PY'
          import os, pathlib, subprocess
          allowed = {"crates/ai/src/rebuild/queued_request.rs", "crates/ai/src/rebuild/runs.rs", "crates/ui-egui/src/project.rs"}
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          assert set(changed) <= allowed, changed
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "queued-recovery-validation"
          out.mkdir(exist_ok=True)
          patch = subprocess.check_output(["git", "diff", "--binary"], text=True)
          (out / "format.patch").write_text(patch)
          print("FORMAT_PATCH_BEGIN\n" + patch + "FORMAT_PATCH_END")
          subprocess.run(["git", "add", "--update"], check=True)
          tree = subprocess.check_output(["git", "write-tree"], text=True).strip()
          (out / "tested-tree.txt").write_text(tree + "\n")
          print("TESTED_TREE=" + tree)
          PY
      - name: Required source policy and formatting gates
        run: |
          set -euo pipefail
          cargo xtask fmt --check
          cargo xtask layers
          cargo xtask locks
          cargo xtask secrets
      - name: Build real CLI helper for AI tests
        run: cargo build --locked -p craft-anything-cli
      - name: Complete affected AI and UI targets
        run: cargo test --no-fail-fast --locked -p craft-anything-ai -p craft-anything-ui-egui
      - name: Clippy affected crates and tests
        run: cargo clippy --locked -p craft-anything-ai -p craft-anything-ui-egui --all-targets -- -D warnings
      - name: Reopened UI rejects both original failure modes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          test = "reopening_a_failed_queued_start_keeps_its_request_ahead_of_a_new_draft"
          def rejects(path, change, expected):
              source = Path(path)
              original = source.read_text()
              mutated = change(original)
              assert mutated != original
              try:
                  source.write_text(mutated)
                  result = subprocess.run(["cargo", "test", "--locked", "-p", "craft-anything-ui-egui", "--lib", test, "--", "--nocapture"], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  print(result.stdout[-16000:])
                  assert result.returncode != 0 and "FAILED" in result.stdout and expected in result.stdout, "negative control failed for another reason"
                  print("NEGATIVE_CONTROL_PASS " + expected)
              finally:
                  source.write_text(original)
          rejects(
              "crates/ai/src/rebuild/runs.rs",
              lambda source: source.replace("keep.set_status(Status::Stopped, message.clone())", "keep.set_status(Status::NeedsYou, message.clone())"),
              "the reopened UI must offer Continue",
          )
          old = subprocess.check_output(["git", "show", "5069c72e7b077a825960fc3bdb8ae68cbe4c67c4:crates/ai/src/rebuild/queued_request.rs"], text=True)
          start = "pub(super) fn restore("
          end = "pub(super) fn save("
          old_restore = old[old.index(start):old.index(end)]
          rejects(
              "crates/ai/src/rebuild/queued_request.rs",
              lambda source: source[:source.index(start)] + old_restore + source[source.index(end):],
              "sending a new draft must not replace the saved request",
          )
          PY
      - name: Confirm the exact validated tree
        run: |
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/queued-recovery-validation/tested-tree.txt")"
          printf '%s\n' "$CANDIDATE_SHA" > "$RUNNER_TEMP/queued-recovery-validation/source-commit.txt"
          printf '%s\n' 'Source policy, format, affected crate tests, Clippy, and both negative controls passed.' > "$RUNNER_TEMP/queued-recovery-validation/result.txt"
      - name: Preserve validation identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: queued-recovery-validation
          path: '${{ runner.temp }}/queued-recovery-validation'
          if-no-files-found: warn
          retention-days: 7
