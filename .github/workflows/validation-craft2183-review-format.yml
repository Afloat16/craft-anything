name: Format conversation review candidate
on:
  push:
    branches: [validation/20261127-craft2183-review-format-8dbb731]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out immutable source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '0691aba6a8ec12f2d510a64fa7ff7aeb89ea130a'
          persist-credentials: false
          fetch-depth: 1
      - name: Install the repository compiler formatter
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt
      - name: Produce formatting patch for review
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0691aba6a8ec12f2d510a64fa7ff7aeb89ea130a"
          rustfmt +1.100.0 --edition 2024 --config-path rustfmt.toml --config skip_children=true crates/ai/src/rebuild/feed.rs crates/ai/src/rebuild/runs.rs crates/engine/src/workspace.rs crates/engine/src/feed.rs crates/ui-egui/src/project.rs crates/ui-egui/src/lib.rs crates/engine/src/feed/backups.rs
          git diff --check
          python - <<'PY'
          import base64, subprocess
          patch = subprocess.check_output(["git", "diff", "--no-ext-diff"])
          print("FORMAT_PATCH_BASE64=" + base64.b64encode(patch).decode())
          PY
