name: ELF stack evidence validation

on:
  push:
    branches: [validation/elf-stack-nx-20261111]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formats:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the validated Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.99.0
          rustc --version
      - name: Verify unchanged-source regression failures and controls
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          source = pathlib.Path("crates/formats/src/elf.rs")
          fixed = source.read_bytes()
          try:
              original = subprocess.check_output(["git", "show", "007aeebb02895fbfcba0ce964217081509ff0431:crates/formats/src/elf.rs"])
              source.write_bytes(original)
              result = subprocess.run(
                  ["cargo", "--config", 'profile.dev.package."*".opt-level=0', "test", "--locked", "-p", "craft-anything-formats", "--test", "elf_stack_nx", "--", "--test-threads=1"],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              print(result.stdout, flush=True)
              failures = [
                  "missing_stack_declaration_keeps_nx_unknown",
                  "relocatable_without_program_headers_has_unknown_nx",
                  "core_without_stack_declaration_has_unknown_nx",
              ]
              if result.returncode == 0 or "test result: FAILED. 2 passed; 3 failed;" not in result.stdout:
                  raise SystemExit("Expected three semantic failures and two passing declaration controls")
              for name in failures:
                  if "test " + name + " ... FAILED" not in result.stdout:
                      raise SystemExit("Missing expected semantic failure: " + name)
          finally:
              source.write_bytes(fixed)
          PY
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run the complete formats suite
        run: cargo --config 'profile.dev.package."*".opt-level=0' test --locked -p craft-anything-formats
      - name: Run strict all-target Clippy
        run: cargo --config 'profile.dev.package."*".opt-level=0' clippy --locked -p craft-anything-formats --all-targets -- -D warnings
      - name: Check repository contracts
        run: |
          cargo --config 'profile.dev.package."*".opt-level=0' xtask layers
          cargo --config 'profile.dev.package."*".opt-level=0' xtask locks
          cargo --config 'profile.dev.package."*".opt-level=0' xtask secrets
      - name: Check the complete WebAssembly layer gate
        run: cargo --config 'profile.dev.package."*".opt-level=0' xtask wasm
      - name: Verify the tested tree remains unchanged
        run: git diff --exit-code
