name: Windows coordination validation

on:
  push:
    branches: [test/r2.9-windows-coordination-20261125]

permissions:
  contents: read

concurrency:
  group: validation-2183-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: "never"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "1"

jobs:
  rename-probe:
    if: github.repository == 'Afloat16/craft-anything' && github.ref == 'refs/heads/test/r2.9-windows-coordination-20261125'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CRAFT_VALIDATION_OUTPUT: ${{ runner.temp }}/craft-2183-probe-results
      CRAFT_PROBE_ROOT: ${{ runner.temp }}/craft-2183-probe-${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_TARGET_DIR: ${{ runner.temp }}/craft-2183-probe-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify NTFS and record exact source
        shell: pwsh
        run: ./validation/windows-lock-rename/prepare.ps1
      - name: Run native Rust 1.100 rename observations
        shell: pwsh
        run: ./validation/windows-lock-rename/run.ps1 -Mode Probe
      - name: Preserve probe logs and source hashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-2183-rename-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CRAFT_VALIDATION_OUTPUT }}
          if-no-files-found: warn
          retention-days: 7

  focused-engine-tests:
    if: github.repository == 'Afloat16/craft-anything' && github.ref == 'refs/heads/test/r2.9-windows-coordination-20261125'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CRAFT_VALIDATION_OUTPUT: ${{ runner.temp }}/craft-2183-engine-results
      CARGO_TARGET_DIR: ${{ runner.temp }}/craft-2183-engine-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify NTFS and record exact source
        shell: pwsh
        run: ./validation/windows-lock-rename/prepare.ps1
      - name: Run both existing production engine controls
        shell: pwsh
        run: ./validation/windows-lock-rename/run.ps1 -Mode Engine
      - name: Preserve both test logs and source hashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-2183-engine-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CRAFT_VALIDATION_OUTPUT }}
          if-no-files-found: warn
          retention-days: 7
